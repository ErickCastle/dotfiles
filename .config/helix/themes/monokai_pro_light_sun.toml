# Ported from Ghostty's Monokai Pro Light Sun theme.
# Adapted from Helix's `monokai_pro.toml` by WindSoilder.
# Original Monokai Pro theme: https://monokai.pro

"ui.linenr.selected" = { bg = "base3" }
"ui.text.focus" = { fg = "yellow", modifiers= ["bold"] }
"ui.menu" = { fg = "base8", bg = "base3" }
"ui.menu.selected" = { fg = "base2", bg = "yellow" }
"ui.virtual.whitespace" = "base5"
"ui.virtual.ruler" = { bg = "base1" }
"ui.virtual.jump-label" = { fg = "red", modifiers = ["bold"] }

"info" = "base8"
"hint" = "base8"

# background color
"ui.background" = { bg = "base2" }

# status bars, panels, modals, autocompletion
"ui.statusline" = { fg = "base8", bg = "base4" }
"ui.statusline.inactive" = { fg = "base6", bg = "base8x0c" }
"ui.statusline.normal" = { fg = "base2", bg = "blue" }
"ui.statusline.insert" = { fg = "base2", bg = "green" }
"ui.statusline.select" = { fg = "base2", bg = "purple" }
"ui.popup" = { bg = "base3" }
"ui.window" = { bg = "base3" }
"ui.help" = { fg = "base8", bg = "base3" }

# active line, highlighting
"ui.selection" = { bg = "selection" }
"ui.cursor.match" = { bg = "base4" }
"ui.cursorline" = { bg = "base1" }

# bufferline, inlay hints
"ui.bufferline" = { fg = "base6", bg = "base8x0c" }
"ui.bufferline.active" = { fg = "base8", bg = "base4" }
"ui.virtual.inlay-hint" = { fg = "base6" }

# comments
"comment" = { fg = "base5", modifiers = ["italic"] }
"ui.linenr" = { fg = "base5" }

# cursor, variables, constants, attributes, fields
"ui.cursor.primary" = { fg = "base7", modifiers = ["reversed"] }
"attribute" = "blue"
"variable"  = "base8"
"constant"  = "orange"
"variable.builtin" = "red"
"constant.builtin" = "red"
"namespace" = "base8"

# base text, punctuation
"ui.text" = { fg = "base8" }
"punctuation" = "base6"

# classes, types, primitives
"type" = "green"
"type.builtin" = { fg = "red" }
"label" = "base8"

# declaration, methods, routines
"constructor" = "blue"
"function" = "green"
"function.macro" = { fg = "blue" }
"function.builtin" = { fg = "cyan" }

# operator, tags, units, punctuations
"operator" = "red"
"variable.other.member" = "base8"

# keywords, special
"keyword" = { fg = "red" }
"keyword.directive" = "blue"
"variable.parameter" = "#b16803"

# error
"error" = "red"

# annotations, decorators
"special" = "#b16803"
"module" = "#b16803"

# warnings, escape characters, regex
"warning" = "orange"
"constant.character.escape" = { fg = "base8" }

# strings
"string" = "yellow"

# integer, floating point
"constant.numeric" = "purple"

# vcs
"diff.plus" = "green"
"diff.delta" = "orange"
"diff.minus" = "red"

# diagnostics
"diagnostic.warning" = { underline = { color = "orange", style = "curl" } }
"diagnostic.error" = { underline = { color = "red", style = "curl" } }
"diagnostic.info" = { underline = { color = "base8", style = "curl" } }
"diagnostic.hint" = { underline = { color = "base8", style = "curl" } }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

# markup
"markup.heading" = "green"
"markup.bold" = { fg = "orange", modifiers = ["bold"] }
"markup.italic" = { fg = "orange", modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "orange", modifiers = ["underlined"] }
"markup.link.text" = "yellow"
"markup.quote" = "green"

[palette]
# primary accent colors (from Ghostty palette)
"red"    = "#ce4770"
"orange" = "#d4572b"
"yellow" = "#b16803"
"green"  = "#218871"
"blue"   = "#2473b6"
"cyan"   = "#2473b6"
"purple" = "#6851a2"

# base colors — derived from background (#f8efe7) to foreground (#2c232e)
"base0"    = "#ede4dc"  # slightly darker than background
"base1"    = "#ede4dc"  # cursorline bg
"base2"    = "#f8efe7"  # background (Ghostty bg)
"base3"    = "#ede4dc"  # popups / panels
"base4"    = "#beb5b3"  # selection bg, statusline bg (Ghostty selection-background)
"base5"    = "#a59c9c"  # comments, linenr (Ghostty palette 8)
"base6"    = "#72696d"  # punctuation, dimmer text (Ghostty cursor-color)
"base7"    = "#4a4148"  # cursor fg
"base8"    = "#2c232e"  # primary foreground (Ghostty fg)

# variants
"base8x0c" = "#ede4dc"  # inactive statusline bg, bufferline bg

# selection
"selection" = "#beb5b3"
